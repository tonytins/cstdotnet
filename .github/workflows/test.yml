name: Test

on:
    push:
        branches: [dev, main, "releases/**"]
    pull_request:
        branches: [dev, main, "releases/**"]

jobs:
    test:
        name: Test (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - name: Setup dotnet
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "10.0.x"
            - name: Restore
              run: dotnet restore
            - name: Build
              run: dotnet build --no-restore
            - name: Test
              run: dotnet test --no-build
