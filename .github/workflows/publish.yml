name: Publish Release Package

# Pushing a releases/** branch publishes the version in CSTNet/CSTNet.csproj to NuGet.
# nuget.org trusts this workflow through Trusted Publishing, so no API key is stored here.
# The policy on nuget.org must name this file (publish.yml) and the `release` environment.
on:
    push:
        branches:
            - "releases/**"

permissions:
    contents: read

jobs:
    publish:
        name: Package Release
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write # lets NuGet/login request a GitHub OIDC token
        steps:
            - uses: actions/checkout@v7
            - name: Setup dotnet
              uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: "10.0.x"
            - name: Restore
              run: dotnet restore
            - name: Build
              run: dotnet build --no-restore -c Release
            - name: Test
              run: dotnet test --no-build -c Release
            - name: Package
              run: dotnet pack CSTNet --no-build -c Release -o artifacts

            # Trade the OIDC token for an API key that lasts one hour, right before pushing.
            - name: NuGet login
              uses: NuGet/login@v1
              id: login
              with:
                  user: ${{ secrets.NUGET_USER }}
            - name: Publish to NuGet
              run: >-
                  dotnet nuget push "artifacts/*.nupkg"
                  --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
                  --source https://api.nuget.org/v3/index.json
                  --skip-duplicate
